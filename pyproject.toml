[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whattheshell"
version = "0.0.1"
description = "Graphical builder for Linux terminal workflows: compose CLI tools into safe, sandboxed workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["cli", "workflow", "terminal", "linux", "sandbox", "bubblewrap", "gui", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: German",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.urls]
Homepage = "https://github.com/Luk007x/WhatTheShell"
Repository = "https://github.com/Luk007x/WhatTheShell"
Issues = "https://github.com/Luk007x/WhatTheShell/issues"
Changelog = "https://github.com/Luk007x/WhatTheShell/releases"

[project.scripts]
whattheshell = "whattheshell.cli:main"
wts = "whattheshell.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
    "cyclonedx-bom>=7.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whattheshell"]
# gebautes Frontend ist gitignored, gehört aber ins Wheel
# SBOM is generated by scripts/sbom.sh and gitignored
artifacts = ["src/whattheshell/api/static/**", "src/whattheshell/sbom.cdx.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/whattheshell/api/static/**", "src/whattheshell/sbom.cdx.json"]
exclude = [
  "gui/tsconfig.tsbuildinfo", "gui/node_modules", "gui/e2e-results", "gui/playwright-report",
  ".claude", ".github", ".graphifyignore", "CLAUDE.md", "PROJEKTAUFTRAG.md", "graphify-out", "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
