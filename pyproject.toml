[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whattheshell"
version = "0.0.1"
description = "Grafischer Baukasten für Terminal-Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "watchfiles>=1.3.0",
]

[project.scripts]
whattheshell = "whattheshell.cli:main"
wts = "whattheshell.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/whattheshell"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
