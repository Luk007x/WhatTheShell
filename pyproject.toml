[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whattheshell"
version = "0.0.1"
description = "Grafischer Baukasten für Terminal-Workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
whattheshell = "whattheshell.cli:main"
wts = "whattheshell.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whattheshell"]
# gebautes Frontend ist gitignored, gehört aber ins Wheel
artifacts = ["src/whattheshell/api/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/whattheshell/api/static/**"]
exclude = ["gui/tsconfig.tsbuildinfo", "gui/node_modules", "gui/e2e-results", "gui/playwright-report"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
