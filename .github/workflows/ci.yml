name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    needs: [gui]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --group dev
      - run: npm ci
        working-directory: gui
      - run: npx playwright install --with-deps chromium
        working-directory: gui
      - run: npm run e2e
        working-directory: gui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: gui/e2e-results
  wheel:
    runs-on: ubuntu-latest
    needs: [gui]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: scripts/build_wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
  pipx-install:
    # bewusst ohne setup-node und ohne bubblewrap: so sieht ein frisches System aus
    runs-on: ubuntu-latest
    needs: [wheel]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pipx
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: pipx install dist/*.whl
      - name: Version und Katalog
        run: |
          test "$(wts --version)" = "WhatTheShell 0.0.1"
          wts tools --search grep | head -3
      - name: Serverstart-Rauchtest
        run: |
          wts gui --no-browser --port 48777 > gui.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 30); do grep -q token= gui.log && break; sleep 0.5; done
          grep -q token= gui.log || { cat gui.log; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48777/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48777/api/status)" = 401
      - name: Sandbox-Hinweis ohne bubblewrap
        run: |
          if command -v bwrap >/dev/null; then echo "bwrap unexpectedly present"; exit 1; fi
          rc=0; wts sandbox > sandbox.log 2>&1 || rc=$?
          cat sandbox.log
          test "$rc" = 1
          grep -q "apt install bubblewrap" sandbox.log
