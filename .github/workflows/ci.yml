name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    needs: [gui]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked --group dev
      - run: npm ci
        working-directory: gui
      - run: npx playwright install --with-deps chromium
        working-directory: gui
      - run: npm run e2e
        working-directory: gui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: gui/e2e-results
  wheel:
    runs-on: ubuntu-latest
    needs: [gui]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - id: version
        run: echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - run: scripts/build_wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
  pipx-install:
    # bewusst ohne setup-node und ohne bubblewrap: so sieht ein frisches System aus
    runs-on: ubuntu-latest
    needs: [wheel]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pipx
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: pipx install dist/*.whl
      - name: Version und Katalog
        run: |
          test "$(wts --version)" = "WhatTheShell ${{ needs.wheel.outputs.version }}"
          wts --sbom | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['metadata']['component']['name']=='whattheshell'"
          wts tools --search grep | head -3
      - name: Serverstart-Rauchtest
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          wts gui start --no-browser --port 48777 > gui.log 2>&1
          trap 'wts gui stop || true' EXIT
          wts gui status
          # the token URL is printed only on a TTY; the state file carries it (0600)
          test "$(stat -c %a "$XDG_RUNTIME_DIR/whattheshell/gui.json")" = 600
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48777/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:48777/api/status)" = 401
          wts gui --no-browser | grep -q "Already running"
          WTS_LANG=de wts gui --no-browser | grep -q "Läuft bereits"
          wts gui stop
          trap - EXIT
          test ! -e "$XDG_RUNTIME_DIR/whattheshell/gui.json"
          rc=0; wts gui status || rc=$?; test "$rc" = 3
      - name: Sandbox-Hinweis ohne bubblewrap
        run: |
          if command -v bwrap >/dev/null; then echo "bwrap unexpectedly present"; exit 1; fi
          rc=0; wts sandbox > sandbox.log 2>&1 || rc=$?
          cat sandbox.log
          test "$rc" = 1
          grep -q "apt install bubblewrap" sandbox.log
