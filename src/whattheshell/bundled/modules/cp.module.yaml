# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: cp
display_name: "cp – Dateien kopieren"
category: Dateien
summary: "Kopiert eine Datei an einen neuen Ort."
override_mode: merge
safety: caution

inputs:
  - id: source
    label: Quelle
    type: path
    required: true
    position: 0
    help: "Datei, die kopiert wird."
  - id: destination
    label: Ziel
    type: path
    required: true
    position: 1
    help: "Zieldatei oder Zielordner. Eine vorhandene Zieldatei wird überschrieben."

i18n:
  en:
    display_name: "cp – copy files"
    category: Files
    summary: "Copies a file to a new location."
    inputs:
      source: {label: "Source", help: "File to be copied."}
      destination: {label: "Destination", help: "Target file or folder. An existing target file is overwritten."}
