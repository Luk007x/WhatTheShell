# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: tee
display_name: "tee – Eingabe in Dateien schreiben"
category: Dateien
summary: "Schreibt den Text aus stdin in eine Datei (und gibt ihn aus)."
override_mode: merge
safety: caution

inputs:
  - id: file
    label: Dateien
    type: path
    multiple: true
    required: true
    position: 0
    help: "Zieldateien. Vorhandene Dateien werden überschrieben."

i18n:
  en:
    display_name: "tee – write input to files"
    category: Files
    summary: "Writes the text from stdin to a file (and prints it)."
    inputs:
      file: {label: "Files", help: "Target files. Existing files are overwritten."}
