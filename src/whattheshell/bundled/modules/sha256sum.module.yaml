# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: sha256sum
display_name: "sha256sum – Prüfsumme berechnen"
category: Archive
summary: "Berechnet SHA-256-Prüfsummen von Dateien oder prüft sie."
description: |
  sha256sum erzeugt aus dem Inhalt einer Datei eine kurze Kennung (Prüfsumme). Typisch ist das Prüfen eines Downloads: Stimmt die Summe mit der des Anbieters überein, ist die Datei unverändert.
  Mit "Summen prüfen" liest sha256sum eine Liste aus Summen und Dateinamen und meldet pro Datei OK oder FAILED. Stolperfalle: Schon ein Byte Unterschied ergibt eine völlig andere Summe.
override_mode: merge
safety: safe

inputs:
  - id: file
    label: Dateien
    type: path
    multiple: true
    position: 0
    help: "Dateien, deren Prüfsumme berechnet wird; mit \"Summen prüfen\" die Liste der Summen."

options:
  - id: check
    flags: ["-c", "--check"]
    label: Summen prüfen
    group: Ablauf
    importance: common
    help: "Liest Summen aus der angegebenen Datei und vergleicht sie mit den echten Dateien."

output:
  stdout:
    kind: lines
  exit_codes:
    0: "Alles in Ordnung"
    1: "Eine Summe stimmt nicht oder Datei fehlt"

examples:
  - title: "Prüfsumme berechnen"
    description: "Berechnet die SHA-256-Summe einer kleinen Datei."
    fixtures:
      - path: hallo.txt
        content: |
          hallo
    args:
      file: ["hallo.txt"]
    expect:
      exit_code: 0
      stdout_contains: "622cb3371c1a08096eaac564fb59acccda1fcdbe13a9dd10b486e6463c8c2525"
  - title: "Summen prüfen"
    description: "Vergleicht die Datei mit der gespeicherten Summe."
    fixtures:
      - path: hallo.txt
        content: |
          hallo
      - path: summen.txt
        content: |
          622cb3371c1a08096eaac564fb59acccda1fcdbe13a9dd10b486e6463c8c2525  hallo.txt
    args:
      check: true
      file: ["summen.txt"]
    expect:
      exit_code: 0
      stdout_contains: "OK"

i18n:
  en:
    display_name: "sha256sum – compute checksum"
    category: Archives
    summary: "Computes SHA-256 checksums of files or verifies them."
    description: |
      sha256sum derives a short identifier (checksum) from the content of a file. It is typically used to verify a download: if the sum matches the provider's, the file is unchanged.
      With "Verify sums" sha256sum reads a list of sums and file names and reports OK or FAILED per file. Pitfall: A single byte of difference gives a completely different sum.
    inputs:
      file: {label: "Files", help: "Files whose checksum is computed; with \"Verify sums\" the list of sums."}
    options:
      check: {label: "Verify sums", help: "Reads sums from the given file and compares them with the actual files."}
