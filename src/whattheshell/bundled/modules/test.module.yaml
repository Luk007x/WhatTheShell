schema_version: 1
tool: test
display_name: "test – Datei oder Bedingung prüfen"
category: Dateien
summary: "Prüft Dateien (Exit 0 = ja, 1 = nein)."
override_mode: merge
safety: safe

inputs:
  - id: expression
    label: Ausdruck
    type: string
    multiple: true
    required: true
    position: 0
    help: "Zum Beispiel -e DATEI (existiert), -f DATEI (normale Datei) oder -x DATEI (ausführbar)."

i18n:
  en:
    display_name: "test – check a file or condition"
    category: Files
    summary: "Checks files (exit 0 = yes, 1 = no)."
    inputs:
      expression: {label: "Expression", help: "For example -e FILE (exists), -f FILE (regular file) or -x FILE (executable)."}
