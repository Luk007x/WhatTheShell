# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: head
display_name: "head – Dateianfang anzeigen"
category: Dateien
summary: "Zeigt die ersten Zeilen einer Datei."
description: |
  head gibt standardmäßig die ersten 10 Zeilen einer Datei aus. Typisch ist ein schneller Blick in große Dateien oder Logs.
  Mit "Zeilen" ändern Sie die Anzahl; ein Minuswert wie -5 zeigt alles außer den letzten 5 Zeilen.
  Stolperfalle: Ohne Dateiangabe wartet head auf Eingaben.
override_mode: merge
safety: safe

inputs:
  - id: file
    label: Dateien
    type: path
    multiple: true
    position: 0
    help: "Dateien, deren Anfang angezeigt wird."

options:
  - id: lines
    flags: ["-n", "--lines"]
    label: Zeilen
    type: string
    metavar: NUM
    group: Umfang
    importance: common
    help: "Anzahl der Zeilen, die gezeigt werden."
  - id: bytes
    flags: ["-c", "--bytes"]
    label: Bytes
    type: string
    metavar: NUM
    group: Umfang
    importance: normal
    help: "Zeigt die ersten Bytes statt Zeilen."
  - id: quiet
    flags: ["-q", "--quiet", "--silent"]
    label: Keine Dateinamen
    group: Ausgabe
    importance: normal
    help: "Unterdrückt die Kopfzeilen mit Dateinamen."
  - id: verbose
    flags: ["-v", "--verbose"]
    label: Immer Dateinamen
    group: Ausgabe
    importance: rare
    help: "Zeigt immer eine Kopfzeile mit dem Dateinamen."

output:
  stdout:
    kind: lines
  exit_codes:
    0: "Erfolgreich"
    1: "Fehler, z. B. Datei nicht lesbar"

examples:
  - title: "Erste zwei Zeilen"
    description: "Zeigt nur den Anfang einer Datei."
    fixtures:
      - path: liste.txt
        content: "eins\nzwei\ndrei\n"
    args:
      lines: "2"
      file: ["liste.txt"]
    expect:
      exit_code: 0
      stdout_contains: "zwei"

i18n:
  en:
    display_name: "head – show start of file"
    category: Files
    summary: "Shows the first lines of a file."
    description: |
      head prints the first 10 lines of a file by default. Typical use is a quick look into large files or logs.
      "Lines" changes the count; a negative value like -5 shows everything except the last 5 lines.
      Pitfall: without a file argument, head waits for input.
    options:
      lines: {label: "Lines", help: "Number of lines to show."}
      bytes: {label: "Bytes", help: "Shows the first bytes instead of lines."}
      quiet: {label: "No file names", help: "Suppresses the header lines with file names."}
      verbose: {label: "Always file names", help: "Always shows a header line with the file name."}
    inputs:
      file: {label: "Files", help: "Files whose beginning is shown."}
