# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: env
display_name: "env – Umgebung anzeigen"
category: System
summary: "Zeigt die Umgebungsvariablen an."
description: |
  Ohne Argumente gibt env alle Umgebungsvariablen als NAME=WERT aus. Dieses Modul dient nur der Anzeige; env kann auch Befehle mit veränderter Umgebung starten, das wird hier bewusst nicht angeboten.
  Stolperfalle: Die Ausgabe kann vertrauliche Werte wie Tokens enthalten.
override_mode: merge
safety: safe

options:
  - id: ignore_environment
    flags: ["-i", "--ignore-environment"]
    label: Leere Umgebung
    type: bool
    group: Ausgabe
    importance: rare
    help: "Beginnt mit leerer Umgebung; die Ausgabe ist dann leer."
  - id: unset
    flags: ["-u", "--unset"]
    label: Variable entfernen
    type: string
    metavar: NAME
    group: Ausgabe
    importance: rare
    help: "Entfernt die Variable aus der angezeigten Umgebung."
  - id: "null"
    flags: ["-0", "--null"]
    label: Mit Nullbyte trennen
    type: bool
    group: Ausgabe
    importance: rare
    help: "Beendet jede Zeile mit einem Nullbyte statt eines Zeilenumbruchs."

output:
  stdout:
    kind: lines

examples:
  - title: "Umgebung anzeigen"
    description: "Gibt alle Umgebungsvariablen aus."
    args: {}
    expect:
      exit_code: 0
      stdout_contains: "="

i18n:
  en:
    display_name: "env – show environment"
    summary: "Shows the environment variables."
    description: |
      Without arguments env prints all environment variables as NAME=VALUE. This module is for display only; env can also start commands with a modified environment, which is deliberately not offered here.
      Pitfall: the output may contain confidential values such as tokens.
    category: System
    options:
      ignore_environment: {label: "Empty environment", help: "Starts with an empty environment; the output is then empty."}
      unset: {label: "Remove variable", help: "Removes the variable from the displayed environment."}
      "null": {label: "Separate with null byte", help: "Ends each line with a null byte instead of a newline."}
