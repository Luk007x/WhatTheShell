# SPDX-License-Identifier: CC0-1.0
schema_version: 1
tool: printenv
display_name: "printenv – Umgebungsvariablen zeigen"
category: System
summary: "Gibt Umgebungsvariablen und ihre Werte aus."
description: |
  printenv zeigt alle Umgebungsvariablen oder, mit Namen, nur den Wert einer bestimmten Variable (z. B. HOME oder PATH). Typisch bei der Fehlersuche, wenn ein Programm Einstellungen aus der Umgebung nicht findet.
  Stolperfallen: Bei einem Namen wird nur der Wert ohne "NAME=" ausgegeben. Existiert die Variable nicht, endet printenv mit Exit-Code 1. Die Ausgabe kann vertrauliche Werte wie Tokens enthalten.
override_mode: merge
safety: safe

inputs:
  - id: variable
    label: Variablenname
    type: string
    position: 0
    help: "Name der Variable, z. B. HOME. Leer lassen, um alle anzuzeigen."

output:
  stdout:
    kind: lines
  exit_codes:
    0: "Variable(n) ausgegeben"
    1: "Variable nicht gesetzt"

examples:
  - title: "PATH anzeigen"
    description: "Gibt den Wert der Variable PATH aus."
    args:
      variable: "PATH"
    expect:
      exit_code: 0
      stdout_contains: "/"

i18n:
  en:
    display_name: "printenv – show environment variables"
    summary: "Prints environment variables and their values."
    description: |
      printenv shows all environment variables or, given a name, only the value of one variable (e.g. HOME or PATH). Typical use is troubleshooting when a program does not find settings from the environment.
      Pitfalls: with a name only the value is printed, without "NAME=". If the variable does not exist, printenv exits with code 1. The output may contain confidential values such as tokens.
    category: System
    inputs:
      variable: {label: "Variable name", help: "Name of the variable, e.g. HOME. Leave empty to show all."}
