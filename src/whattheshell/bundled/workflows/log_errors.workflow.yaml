schema_version: 1
name: "Fehler in Logs zählen"
description: "Sucht ERROR in allen Logdateien und schreibt bei Treffern einen Bericht."
variables:
  logdir: { type: path, default: "./logs", label: "Log-Ordner" }
steps:
  - id: finde
    tool: find
    args: { start: ["{{ var.logdir }}"], name: "*.log", type: f }
  - id: suche
    tool: grep
    args: { patterns: ERROR, recursive: true, include: "*.log", files: ["{{ var.logdir }}"] }
    ok_exit_codes: [0, 1]   # grep Exit 1 = keine Treffer
  - id: zaehle
    tool: wc
    args: { lines: true }
    stdin: { pipe: suche }
  - id: pruefe
    kind: if
    condition: { source: zaehle.stdout, number_gt: 0 }
    then:
      - id: bericht
        tool: tee
        args: { file: [bericht.txt] }
        stdin: { text: "Dateien:\n{{ finde.stdout }}\n\nTreffer:\n{{ suche.stdout }}\n" }
    else:
      - { id: ok, kind: message, text: "Alles in Ordnung." }
layout:
  nodes:
    finde: { x: 0, y: 0 }
    suche: { x: 240, y: 0 }
    zaehle: { x: 480, y: 0 }
    pruefe: { x: 720, y: 0 }
