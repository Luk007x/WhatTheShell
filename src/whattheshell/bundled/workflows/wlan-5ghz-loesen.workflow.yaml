schema_version: 1
name: "WLAN-5-GHz-Bindung lösen"
description: "Entfernt die feste BSSID einer NetworkManager-Verbindung wieder (Gegenstück zu „WLAN auf 5 GHz fixieren“)."
variables:
  ssid: { type: string, required: true, label: "Verbindungsname (SSID)", help: "Name der Verbindung laut nmcli connection show." }
steps:
  - id: loesen
    label: "BSSID-Bindung entfernen"
    tool: nmcli
    command: [connection, modify]
    extra_args: ["{{ var.ssid }}", 802-11-wireless.bssid, ""]
  - id: aktivieren
    label: "Verbindung neu aktivieren"
    tool: nmcli
    command: [connection, up]
    extra_args: ["{{ var.ssid }}"]
  - { id: fertig, kind: message, text: "BSSID-Bindung für {{ var.ssid }} entfernt." }
